name: E3SM CI for ELM-ATS

# Keep all workflow triggers under a single top-level 'on' block.
on:
  # Run on pull requests targeting any branch.
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    paths:
      - '.github/workflows/e3sm-ci-for-elm-ats.yml'
      - 'cime_config/**'
      - 'components/elm/**'
      - 'driver-moab/**'
      - 'driver-mct/**'
      - '!components/eam/docs/**'
      - '!components/eam/mkdocs.yml'
      - '!components/eamxx/docs/**'
      - '!components/eamxx/mkdocs.yml'
      - '!components/elm/docs/**'
      - '!components/elm/mkdocs.yml'

  # Also run on pushes to any branch (e.g. after a merge).
  push:
    paths:
      - '.github/workflows/e3sm-ci-for-elm-ats.yml'
      - 'cime_config/**'
      - 'components/elm/**'
      - 'driver-moab/**'
      - 'driver-mct/**'
      - '!components/eam/docs/**'
      - '!components/eam/mkdocs.yml'
      - '!components/eamxx/docs/**'
      - '!components/eamxx/mkdocs.yml'
      - '!components/elm/docs/**'
      - '!components/elm/mkdocs.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci:
    # Restrict execution to the amanzi/E3SM fork used for ELM-ATS.
    if: ${{ github.repository == 'amanzi/E3SM' }}
    name: ELM CIME / ${{ matrix.test }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test:
          - SMS_Vmct_D_Ln5_P4.ne4pg2_oQU480.F2010
          - ERS_Vmct_Ld5_P4.ne4pg2_oQU480.F2010.eam-wcprod_F2010
          - ERS_Vmct_P4.ne4pg2_oQU480.A
          - ERS_Vmct_P4.ne4pg2_oQU480.I1850ELMCN.elm-qian_1948
    env:
      # ghci-oci (the machine the old test names embedded) and its container,
      # containers-ghci, were both retired upstream; e3sm-container (shipped
      # inside e3sm-image) is the current GitHub-hosted-runner replacement.
      IMAGE: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          path: E3SM
          persist-credentials: false
          show-progress: false
          submodules: recursive
      -
        name: Pull the image
        run: docker pull "$IMAGE"
      -
        name: CIME
        run: |
          mkdir -p scratch
          sudo chown -R 1000:1000 E3SM scratch
          docker run --rm \
            -v "$PWD/E3SM:/projects/e3sm/work/E3SM" \
            -v "$PWD/scratch:/home/e3sm/e3sm_scratch" \
            "$IMAGE" bash -lc '. /projects/e3sm/cime/enable.sh &&
              cd /projects/e3sm/work/E3SM/cime/scripts &&
              ./create_test ${{ matrix.test }} --machine e3sm-container --compiler gnu \
                --wait --debug --test-id gh'
          sudo chown -R "$(id -u):$(id -g)" scratch
      -
        name: Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ${{ matrix.test }}
          path: |
            scratch/*.gh/TestStatus.log
            scratch/*.gh/bld/*.bldlog.*
            scratch/*.gh/run/*.log.*
            scratch/*.gh/run/*.cprnc.out
